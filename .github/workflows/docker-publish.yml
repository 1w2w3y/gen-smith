name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version prefix
        run: echo "YYMM=$(date -u +'%y%m')" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=0.${{ env.YYMM }}.${{ github.run_number }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The dd-trace preload runs before any application code, and only the
      # standalone image can prove it resolves. Boot the image before pushing
      # it so a missing traced dependency fails here instead of in a cluster.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gen-smith:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name gen-smith-smoke -p 3000:3000 gen-smith:smoke
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs gen-smith-smoke
          if [ "$code" != "200" ]; then
            echo "::error::container did not serve HTTP 200 (last status: ${code:-none})"
            docker rm -f gen-smith-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/api/config > /dev/null
          docker rm -f gen-smith-smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
